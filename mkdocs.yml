site_name: Regular regexes
site_description: >-
  Ready-made Python regexes for investigations, with checksum validation: IDs, IBAN, VAT, phones, plates,
  crypto addresses and seed phrases, for 10 countries.
site_url: https://regexes.upshift.be/
repo_url: https://github.com/upshiftbe/regular-regexes
repo_name: upshiftbe/regular-regexes
edit_uri: ""

theme:
  name: shadcn
  # templates/seo.html: <title>, link previews and structured data for search engines
  custom_dir: overrides
  accent: "#025a50"
  show_stargazers: false

# Upshift green for links and accents
extra_css:
  - stylesheets/upshift.css

# The theme dates each page from git; the generated regex pages aren't in git (docs/hooks.py).
hooks:
  - docs/hooks.py

plugins:
  # Also split words on _ and . so "system" finds rre.ios_system_path.
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # The regex pages are written at build time from the regexes.json files (docs/gen_pages.py).
  - gen-files:
      scripts:
        - docs/gen_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# A link to a validator that has no section on the validators page fails the --strict build.
validation:
  anchors: warn

exclude_docs: |
  gen_pages.py
  hooks.py
  requirements.txt
  descriptions/
  categories.json
