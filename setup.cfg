[metadata]
name = regular-regexes
version = 0.1.0
author = Upshift
author_email = hello@upshift.be
description = Simplify the usage of common regexes
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/upshiftbe/regular-regexes
project_urls =
    Documentation = https://regexes.upshift.be/
    Bug Tracker = https://github.com/upshiftbe/regular-regexes/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = regular_regexes
package_dir =
    = .
python_requires = >=3.6
install_requires =
    phonenumbers

[options.packages.find]
where = .

[options.package_data]
regular_regexes = */regexes.json, intl/bip39_english.txt