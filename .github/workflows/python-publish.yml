# Publishes regular-regexes to PyPI when a GitHub release is published. No token: PyPI trusts
# this workflow through Trusted Publishing (project regular-regexes, environment "pypi").

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Test and build
      run: |
        python -m pip install --upgrade pip
        pip install build pytest
        pytest -q
        python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
