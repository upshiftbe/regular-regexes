# Builds the documentation site (MkDocs Material, regex pages generated from the regexes.json
# files) and publishes it on GitHub Pages: https://upshiftbe.github.io/regular-regexes/
# A pull request only builds it, so a broken link or a validator without a section fails there.

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build
      run: |
        pip install -r docs/requirements.txt
        mkdocs build --strict
    - uses: actions/upload-pages-artifact@v3
      if: github.event_name != 'pull_request'
      with:
        path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
