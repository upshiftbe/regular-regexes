# Builds the documentation site (MkDocs with the shadcn theme, regex pages generated from the regexes.json files),
# so a broken link or a validator without a section fails here. Netlify publishes it from main, on https://regexes.upshift.be
# (see netlify.toml).

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Build
      run: |
        pip install -r docs/requirements.txt
        mkdocs build --strict
